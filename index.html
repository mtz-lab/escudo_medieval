<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escudo medieval 3D</title>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    body { margin:0; font-family: system-ui, sans-serif; background:#1b1b22; color:#eee; }
    header { text-align:center; padding:14px; }
    model-viewer { width:100%; height:70vh; background:radial-gradient(#3a3a4a,#16161c); }
    .panel { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; padding:16px; }
    button { padding:12px 20px; border:0; border-radius:8px; background:#c08a3e;
             color:#fff; font-size:16px; cursor:pointer; }
    button:hover { background:#d9a24f; }
  </style>
</head>
<body>
  <header><h1>Escudo medieval</h1></header>

  <model-viewer id="escudo" src="escudo.glb" alt="Escudo medieval en 3D"
    camera-controls auto-rotate shadow-intensity="1"
    environment-image="neutral" exposure="1.1" interaction-prompt="auto">
  </model-viewer>

  <div class="panel">
    <button id="btnAcero">Cambiar color del acero</button>
    <button id="btnNormal">Normal map del bronce: ON</button>
    <button id="btnMadera">Cambiar tono de la madera</button>
  </div>

<script>
  const viewer = document.getElementById('escudo');

  viewer.addEventListener('load', () => {
    const mats = viewer.model.materials;
    console.log('Materiales:', mats.map(m => m.name));
    const get = n => mats.find(m => m.name === n);
    const acero = get('Acero'), bronce = get('Bronce'), madera = get('Madera');

    // 1) Color del acero
    const coloresAcero = [[1,1,1,1], [0.55,0.70,1,1], [1,0.85,0.5,1], [0.6,0.4,0.35,1]];
    let ia = 0;
    document.getElementById('btnAcero').onclick = () => {
      ia = (ia + 1) % coloresAcero.length;
      acero.pbrMetallicRoughness.setBaseColorFactor(coloresAcero[ia]);
    };

    // 2) Normal map del bronce ON/OFF
    const normalOriginal = bronce.normalTexture.texture;
    let normalOn = true;
    const btnN = document.getElementById('btnNormal');
    btnN.onclick = () => {
      normalOn = !normalOn;
      bronce.normalTexture.setTexture(normalOn ? normalOriginal : null);
      btnN.textContent = 'Normal map del bronce: ' + (normalOn ? 'ON' : 'OFF');
    };

    // 3) Tono de la madera
    const tonosMadera = [[1,1,1,1], [1,0.6,0.45,1], [0.55,0.55,0.7,1], [1.3,1.2,0.9,1]];
    let im = 0;
    document.getElementById('btnMadera').onclick = () => {
      im = (im + 1) % tonosMadera.length;
      madera.pbrMetallicRoughness.setBaseColorFactor(tonosMadera[im]);
    };
  });
</script>
</body>
</html>
